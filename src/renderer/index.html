<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>素材板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="window-titlebar">
      <span>素材板</span>
    </div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div>
            <h1>素材板</h1>
            <p>个人本地设计素材库</p>
          </div>
        </div>

        <nav class="nav-group">
          <button class="nav-item active" data-view="all">全部素材 <span id="allCount">0</span></button>
          <button class="nav-item" data-view="recent">最近导入</button>
          <button class="nav-item" data-view="favorite">收藏</button>
          <button class="nav-item" data-view="uncategorized">未分类</button>
        </nav>

        <section class="folder-nav">
          <div class="section-title">
            <span>软件内文件夹</span>
            <button id="newFolderBtn" title="新建文件夹">+</button>
          </div>
          <div id="folderList" class="folder-list"></div>
        </section>

        <section class="board-nav">
          <div class="section-title">
            <span>画板</span>
            <button id="newBoardBtn" title="新建画板">+</button>
          </div>
          <div id="boardList" class="board-list"></div>
        </section>

        <section class="note-nav">
          <div class="section-title">
            <span>笔记</span>
            <button id="newNoteBtn" data-create-note title="新建笔记">+</button>
          </div>
          <div id="noteList" class="note-list"></div>
        </section>

        <div class="library-card">
          <span>图片保存方式</span>
          <strong id="libraryPath">软件自动保存，不需要电脑文件夹整理</strong>
          <button id="openImportBtn">查看软件内部库</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h2 id="viewTitle">全部素材</h2>
            <p id="viewSubtitle">直接 Ctrl+V 粘贴图片。软件内文件夹只负责分类。</p>
          </div>
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="搜索文件名" />
            <select id="sortSelect">
              <option value="newest">最新导入</option>
              <option value="largest">尺寸最大</option>
              <option value="name">文件名</option>
            </select>
            <button id="importBtn">备用：选择文件</button>
          </div>
        </header>

        <div class="workspace-body">
          <div class="drop-hint" id="dropHint">
            <strong>松手放进素材库</strong>
            <span>图片会保存到软件内部，不会依赖电脑原文件夹。</span>
          </div>
          <section class="board-dock hidden" id="boardDock">
            <div class="board-tab-strip" id="boardTabStrip"></div>
            <div class="board-desktop" id="boardDesktop"></div>
          </section>
          <section class="asset-grid" id="assetGrid"></section>
        </div>
      </main>

      <aside class="inspector">
        <section class="panel">
          <h3>当前图片</h3>
          <div id="assetInfo" class="empty-info">选择一张图片后，这里会显示图片信息。</div>
        </section>
      </aside>
    </div>

    <div class="folder-popover hidden" id="folderPopover"></div>
    <div class="folder-context-menu hidden" id="folderContextMenu"></div>
    <div class="folder-context-menu board-context-menu hidden" id="boardContextMenu"></div>

    <div class="viewer hidden" id="viewer">
      <div class="viewer-topbar">
        <strong class="viewer-title">高清查看</strong>
        <div class="viewer-actions">
          <button id="prevBtn" type="button">上一张</button>
          <button id="nextBtn" type="button">下一张</button>
          <button id="fitBtn" type="button">适应窗口</button>
          <button id="actualBtn" type="button">原始尺寸</button>
          <button id="toggleAnnotationsBtn" type="button">隐藏批注</button>
        </div>
        <button id="closeViewerBtn" class="viewer-close-button" type="button" title="退出查看（Esc）" aria-label="退出图片查看">×</button>
      </div>
      <div class="viewer-body">
        <div class="image-plane" id="imagePlane">
          <img id="viewerImage" alt="" />
          <canvas id="annotationCanvas"></canvas>
        </div>
        <aside class="annotation-tools">
          <h3>注释</h3>
          <textarea id="viewerNoteInput" class="asset-note-input viewer-note-input" placeholder="添加注释"></textarea>
          <div class="tool-row">
            <button class="tool active" data-tool="hand">抓手</button>
            <button class="tool" data-tool="pen">画笔</button>
            <button class="tool" data-tool="rect">矩形</button>
            <button class="tool" data-tool="arrow">箭头</button>
            <button class="tool" data-tool="text">文字</button>
          </div>
          <label>颜色 <input id="colorInput" type="color" value="#ec5b3f" /></label>
          <label>粗细 <input id="strokeInput" type="range" min="2" max="12" value="4" /></label>
          <button id="undoBtn">撤销</button>
          <button id="clearBtn">清除批注</button>
          <div class="viewer-meta" id="viewerMeta"></div>
        </aside>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
